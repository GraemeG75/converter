  <text x="140" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#f3f4f6">
    Fast, Accurate Conversions for Engineers &amp; Creators
  </text>

  <!-- Tags / Pills -->
  <g transform="translate(140, 365)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="200" height="42" rx="21" fill="rgba(134, 59, 255, 0.2)" stroke="rgba(134, 59, 255, 0.4)" stroke-width="1"/>
    <text x="100" y="27" font-family="sans-serif" font-size="16" font-weight="600" fill="#c084fc" text-anchor="middle">GPS Coordinates</text>

    <!-- Pill 2 -->
    <rect x="215" y="0" width="190" height="42" rx="21" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="310" y="27" font-family="sans-serif" font-size="16" font-weight="600" fill="#7dd3fc" text-anchor="middle">Color Formats</text>

    <!-- Pill 3 -->
    <rect x="420" y="0" width="200" height="42" rx="21" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="520" y="27" font-family="sans-serif" font-size="16" font-weight="600" fill="#6ee7b7" text-anchor="middle">UUID / GUID Generator</text>

    <!-- Pill 4 -->
    <rect x="635" y="0" width="180" height="42" rx="21" fill="rgba(244, 63, 94, 0.2)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1"/>
    <text x="725" y="27" font-family="sans-serif" font-size="16" font-weight="600" fill="#fda4af" text-anchor="middle">Number Bases</text>
