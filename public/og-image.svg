  <!-- Footer Link inside graphic -->
  <text x="140" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#9ca3af">
    https://guid.studio  •  Powered by generatedpixel.dev
